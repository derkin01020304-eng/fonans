name: derk_finance
description: Offline personal finance assistant with encrypted Android storage.
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  sqflite_sqlcipher: 3.4.1
  sqflite_common: ^2.5.6
  flutter_secure_storage: 9.2.4
  local_auth: 2.3.0
  cryptography: 2.7.0
  crypto: 3.0.6
  json_annotation: 4.9.0
  intl: 0.20.2
  path: 1.9.1
  path_provider: 2.1.5
  uuid: 4.5.1
  csv: 6.0.0
  excel: 4.0.6
  file_picker: 10.3.3
  share_plus: 11.1.0
  flutter_appauth: 9.0.1
  http: 1.5.0
dev_dependencies:
  analyzer: 7.7.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: 2.5.4
  json_serializable: 6.9.5
  sqflite_common_ffi: 2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/schema_v1.sql
    - assets/schema_v2.sql
    - assets/mcp_tools.json
    - assets/sample_statement.csv
